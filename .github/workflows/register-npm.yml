name: Register npm package

on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Completed main build containing the verified npm package
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  register:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check source build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" \
            --jq '.head_branch == "main" and .event == "push" and .status == "completed"')" = true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts/npm
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run }}
      - name: Sign in to npm
        id: login
        run: npm login --auth-type=web --browser=false
      - name: Submit first package for approval
        env:
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          test "$(npm whoami)" = "$EXPECTED_OWNER"
          npm stage publish artifacts/npm/*.tgz --access public --provenance
      - name: Revoke initial npm session
        if: always() && steps.login.outcome == 'success'
        run: npm logout
